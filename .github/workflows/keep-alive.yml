name: Keep Alive

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping website
        run: curl -fsS -o /dev/null https://the-economic-tea.pages.dev

      - name: Write heartbeat to database
        run: |
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -fsS -X PATCH "https://jxpbrpzdjkiassozwiuh.supabase.co/rest/v1/heartbeat?id=eq.1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"last_ping\": \"$NOW\"}"
