name: Keep Alive

on:
  schedule:
    - cron: '0 6 */5 * *'   # runs every 3 days at 6 AM UTC
  workflow_dispatch:         # lets you also run it manually anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the website
        run: curl -sSf https://the-economic-tea.pages.dev > /dev/null

      - name: Ping the database
        run: |
          curl -sSf "https://jxpbrpzdjkiassozwiuh.supabase.co/rest/v1/articles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
